name: pixel release

# Releases the pixel packages that live under pixel/. One button: run this workflow with a
# bump and it tags pixel-v<next>, builds the engine on every platform, and publishes all five
# packages to npm through npm's trusted publishing (OIDC). Pushing a pixel-v* tag by hand does
# the same without the bump. terminal-browser's own releases are the plain v* tags.
on:
  push:
    branches: [main]
    tags: ["pixel-v*"]
    paths: ["pixel/**", ".github/workflows/pixel-release.yml"]
  pull_request:
    paths: ["pixel/**", ".github/workflows/pixel-release.yml"]
  workflow_dispatch:
    inputs:
      bump:
        description: "Cut a release"
        type: choice
        default: patch
        options: [patch, minor, major]

permissions:
  contents: read

concurrency:
  group: pixel-release-${{ github.event_name == 'workflow_dispatch' && 'cut' || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.v.outputs.version }}
      ref: ${{ steps.v.outputs.ref }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/pixel-v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/pixel-v}"
            echo "ref=$GITHUB_REF" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = workflow_dispatch ]; then
            TAG="$(pixel/scripts/next-version.sh "${{ inputs.bump }}")"
            VERSION="${TAG#pixel-v}"
            git -c user.name="pixel release" -c user.email="release@zenbu.dev" \
              tag -a "$TAG" -m "pixel ${TAG#pixel-}"
            git push origin "$TAG"
            echo "ref=refs/tags/$TAG" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            VERSION="0.0.0-$(git rev-parse --short HEAD)"
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  check:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: PIXEL_SKIP_DOWNLOAD=1 pnpm install --frozen-lockfile
      - run: pnpm --filter @zenbu-labs/pixel build
      - run: pnpm --filter './pixel/**' typecheck
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --workspace --all-targets
        working-directory: pixel/engine

  native:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin-arm64
            macos-target: "11.0"
          - os: macos-15-intel
            platform: darwin-x64
          - os: ubuntu-latest
            platform: linux-x64
            container: quay.io/pypa/manylinux_2_28_x86_64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            container: quay.io/pypa/manylinux_2_28_aarch64
    runs-on: ${{ matrix.os }}
    # linux builds run in a glibc 2.28 image so pixel.node loads on RHEL 8 / Debian 12 era systems
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pixel/engine
      - if: matrix.macos-target
        run: echo "MACOSX_DEPLOYMENT_TARGET=${{ matrix.macos-target }}" >> "$GITHUB_ENV"
      - run: node scripts/build-native.mjs --release
        working-directory: pixel/packages/pixel
      - if: matrix.macos-target
        run: vtool -show-build pixel/packages/native/${{ matrix.platform }}/pixel.node | grep -qE "minos ${{ matrix.macos-target }}$"
      - if: matrix.container
        run: objdump -T pixel/packages/native/${{ matrix.platform }}/pixel.node | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -1 | grep -qx GLIBC_2.28
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: |
            pixel/packages/native/${{ matrix.platform }}/pixel.node
            pixel/packages/native/${{ matrix.platform }}/native-scroll-helper
          if-no-files-found: error

  publish:
    if: needs.prepare.outputs.release == 'true'
    needs: [prepare, check, native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # trusted publishing needs a newer npm than node 22 bundles
      - run: npm install -g npm@latest
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: artifacts
      - name: Place native artifacts
        run: |
          for dir in artifacts/native-*; do
            platform="${dir#artifacts/native-}"
            cp "$dir"/* "pixel/packages/native/$platform/"
          done
          chmod +x pixel/packages/native/darwin-*/native-scroll-helper
      - run: PIXEL_SKIP_DOWNLOAD=1 pnpm install --frozen-lockfile
      - run: pnpm --filter @zenbu-labs/pixel build
      - name: Stamp versions from the tag
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          for pkg in pixel/packages/native/* pixel/packages/pixel pixel/packages/create-pixel; do
            (cd "$pkg" && npm version "$VERSION" --no-git-tag-version --allow-same-version)
          done
          node -e '
            const fs = require("fs");
            const file = "pixel/packages/pixel/package.json";
            const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
            for (const name of Object.keys(pkg.optionalDependencies)) pkg.optionalDependencies[name] = process.argv[1];
            fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + "\n");
          ' "$VERSION"
      - name: Publish
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          status() {
            curl -s -o /dev/null -w "%{http_code}" "https://registry.npmjs.org/$(node -p "require('./$1/package.json').name.replace('/', '%2f')")/$VERSION"
          }
          # Skip versions that are already on npm, so a partly finished release can be re-run.
          publish() {
            if [ "$(status "$1")" = 200 ]; then echo "$1 $VERSION is already published"; return 0; fi
            (cd "$1" && npm publish --access public --provenance)
          }
          for pkg in pixel/packages/native/*; do publish "$pkg"; done
          publish pixel/packages/pixel
          publish pixel/packages/create-pixel
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "pixel-v${{ needs.prepare.outputs.version }}" -R "$GITHUB_REPOSITORY" \
            --title "pixel v${{ needs.prepare.outputs.version }}" --notes "pixel ${{ needs.prepare.outputs.version }}, published to npm as @zenbu-labs/pixel"
