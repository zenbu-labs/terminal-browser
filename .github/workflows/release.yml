name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bump:
        description: "Cut a stable release (dev build if none)"
        type: choice
        default: none
        options: [none, patch, minor, major]
      deploy_worker:
        description: "Deploy the release worker even for a branch build"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ (startsWith(github.ref, 'refs/tags/v') || inputs.bump != 'none') && 'stable' || 'dev' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') && (inputs.bump == '' || inputs.bump == 'none') }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.v.outputs.channel }}
      version: ${{ steps.v.outputs.version }}
      ref: ${{ steps.v.outputs.ref }}
      flip: ${{ steps.v.outputs.flip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: v
        run: |
          BUMP="${{ inputs.bump }}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            CHANNEL=stable
            VERSION="${GITHUB_REF#refs/tags/}"
            REF="$VERSION"
          elif [ -n "$BUMP" ] && [ "$BUMP" != none ]; then
            CHANNEL=stable
            VERSION="$(scripts/next-version.sh "$BUMP")"
            git -c user.name="terminal-browser release" -c user.email="release@zenbu.dev" \
              tag -a "$VERSION" -m "terminal-browser $VERSION"
            git push origin "$VERSION"
            REF="$VERSION"
          elif [ "$GITHUB_REF" = refs/heads/main ]; then
            CHANNEL=dev
            VERSION="main-$(git rev-parse --short HEAD)"
            REF="$GITHUB_SHA"
          else
            # A branch build publishes a pinned version anyone can install via
            # /install/v/<version>, without moving the dev channel.
            CHANNEL=dev
            FLIP=false
            BRANCH="$(printf %s "${GITHUB_REF#refs/heads/}" | tr -c "a-zA-Z0-9._-" "-")"
            VERSION="$BRANCH-$(git rev-parse --short HEAD)"
            REF="$GITHUB_SHA"
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "flip=${FLIP:-true}" >> "$GITHUB_OUTPUT"

  # The pixel addon for linux is built the way pixel's own release builds it: inside a glibc
  # 2.28 image, so pixel.node loads on RHEL 8 / Debian 12 era systems. macOS builds it on the
  # release runner itself.
  pixel-native-linux:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
            container: quay.io/pypa/manylinux_2_28_x86_64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pixel/engine
      - run: node scripts/build-native.mjs --release
        working-directory: pixel/packages/pixel
      - run: objdump -T pixel/packages/native/${{ matrix.target }}/pixel.node | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -1 | grep -qx GLIBC_2.28
      - uses: actions/upload-artifact@v4
        with:
          name: pixel-native-${{ matrix.target }}
          path: pixel/packages/native/${{ matrix.target }}/pixel.node
          if-no-files-found: error

  build:
    needs: [prepare, pixel-native-linux]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: [self-hosted, macOS, ARM64]
          - target: darwin-x64
            runner: macos-26-intel
          - target: linux-x64
            runner: ubuntu-22.04
          - target: linux-arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/../cargo-target
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      # the self-hosted mac has its toolchains pre-provisioned
      - uses: pnpm/action-setup@v4
        if: matrix.target != 'darwin-arm64'

      - uses: actions/setup-node@v4
        if: matrix.target != 'darwin-arm64'
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.target != 'darwin-arm64'

      - run: brew install nasm
        if: matrix.target == 'darwin-x64'

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @zenbu-labs/pixel build

      - run: pnpm --filter @zenbu-labs/pixel build:native -- --release
        if: startsWith(matrix.target, 'darwin')

      - uses: actions/download-artifact@v4
        if: startsWith(matrix.target, 'linux')
        with:
          name: pixel-native-${{ matrix.target }}
          path: pixel/packages/native/${{ matrix.target }}

      - name: Build
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: scripts/release.sh "${{ needs.prepare.outputs.version }}" "${{ needs.prepare.outputs.channel }}"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist-release/terminal-browser-${{ matrix.target }}.tar.gz
            dist-release/manifest-${{ matrix.target }}.json
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [prepare, build, worker]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist-release

      - name: Publish
        id: publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_ORIGIN: ${{ vars.RELEASE_ORIGIN }}
          FLIP_LATEST: ${{ needs.prepare.outputs.flip }}
        run: |
          scripts/publish-r2.sh | tee /tmp/publish.log
          grep -E '^(pinned|latest)=' /tmp/publish.log >> "$GITHUB_OUTPUT" || true

      - name: GitHub release
        if: needs.prepare.outputs.channel == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            gh release create "$VERSION" \
              --title "$VERSION" \
              --notes "$(printf 'Install:\n\n```sh\ncurl -fsSL %s | bash\n```\n\nPinned to this version:\n\n```sh\ncurl -fsSL %s | bash\n```\n' \
                "${{ steps.publish.outputs.latest }}" "${{ steps.publish.outputs.pinned }}")"
          fi
          gh release upload "$VERSION" dist-release/terminal-browser-*.tar.gz --clobber

      - name: Summary
        run: |
          {
            echo "### terminal-browser \`${{ needs.prepare.outputs.version }}\` (${{ needs.prepare.outputs.channel }})"
            echo
            echo "This build:"
            echo '```sh'
            echo "curl -fsSL ${{ steps.publish.outputs.pinned }} | bash"
            echo '```'
            if [ -n "${{ steps.publish.outputs.latest }}" ]; then
              echo "Always current ${{ needs.prepare.outputs.channel }}:"
              echo '```sh'
              echo "curl -fsSL ${{ steps.publish.outputs.latest }} | bash"
              echo '```'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

  worker:
    runs-on: ubuntu-latest
    needs: [prepare, build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy worker
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || (inputs.bump != '' && inputs.bump != 'none') || inputs.deploy_worker
        working-directory: release-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci
          npx wrangler d1 migrations apply terminal-browser-stats --remote
          npx wrangler deploy
