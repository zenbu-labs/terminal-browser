<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      /* no background anywhere, so the terminal shows through the page too */
      html, body { margin: 0; height: 100%; background: transparent; color: #eee; font: 15px/1.5 -apple-system, sans-serif; }
      .card { margin: 18px; padding: 14px 16px; border-radius: 12px; background: rgba(255, 255, 255, 0.10); border: 1px solid rgba(255, 255, 255, 0.22); }
    </style>
  </head>
  <body>
    <div class="card">This page paints no background. The card is a translucent veil, and everything around it is the terminal.</div>
  </body>
</html>
