<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>served from the remote machine</title>
    <style>
      body { font: 20px/1.5 system-ui, sans-serif; margin: 48px; color: #1b1b1f; background: #f4f4f6; }
      code { background: #e3e3e8; padding: 2px 6px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <h1>served from the remote machine</h1>
    <p>This page is served by <code>bundle/start</code> on the ssh host and fetched through the tunnel.</p>
    <p id="host"></p>
    <script>document.getElementById("host").textContent = location.href;</script>
  </body>
</html>
