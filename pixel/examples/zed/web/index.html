<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=0" />
    <title>Zed</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; background: #131314; color: #ddd; font: 14px system-ui, sans-serif; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; user-select: none; }
      #error { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; background: #131314; color: #f88; white-space: pre-wrap; z-index: 10; }
      #error[hidden] { display: none; }
      #quit { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.35); z-index: 20; }
      #quit[hidden] { display: none; }
      #quit .card { min-width: 280px; padding: 16px; display: flex; flex-direction: column; gap: 14px; background: #232323; border: 1px solid #3c3c3c; border-radius: 8px; box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5); }
      #quit .buttons { display: flex; justify-content: flex-end; gap: 8px; }
      #quit button { font: inherit; padding: 4px 12px; color: #ddd; background: #2e2e2e; border: 1px solid #444; border-radius: 4px; cursor: pointer; }
      #quit button.primary { background: #3d5a80; border-color: #4f73a3; }
    </style>
  </head>
  <body>
    <div id="error" hidden></div>
    <div id="quit" hidden>
      <div class="card">
        <div>Are you sure you want to quit?</div>
        <div class="buttons">
          <button id="quit-cancel">Cancel</button>
          <button id="quit-confirm" class="primary">Quit</button>
        </div>
      </div>
    </div>
    <script type="module" src="./loader.js"></script>
  </body>
</html>
