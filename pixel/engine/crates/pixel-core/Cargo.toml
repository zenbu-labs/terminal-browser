[package]
name = "pixel-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
rayon = "1"
libc = { workspace = true }
base64 = { workspace = true }
fontdue = { workspace = true }
miniz_oxide = { workspace = true }
taffy = { workspace = true }
tiny-skia = { workspace = true }
image = { workspace = true }
arboard = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }

[target.'cfg(windows)'.dependencies]
uds_windows = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading", "Win32_Networking_WinSock"] }

[target.'cfg(target_os = "linux")'.dependencies]
