id = "zenbu-labs.terminal-browser"
name = "Terminal Browser"
version = "0.1.1"
min_herdr_version = "0.8.2"
description = "Open a browser inside herdr"
platforms = ["linux", "macos"]

[[panes]]
id = "browser"
title = "Terminal Browser"
description = "A browser pane rendered by terminal-browser"
placement = "split"
command = ["/bin/sh", "-c", 'exec "$HERDR_PLUGIN_ROOT/pane.sh"']

[[actions]]
id = "open-split"
title = "Open terminal-browser (right split)"
description = "Split the focused pane and open terminal-browser in it"
contexts = ["global"]
command = ["/bin/sh", "-c", 'exec "$HERDR_PLUGIN_ROOT/open-split.sh"']

[[actions]]
id = "open-url"
title = "Open in Terminal Browser"
description = "Open a clicked URL in a terminal-browser pane"
contexts = ["global", "pane", "selection"]
command = ["/bin/sh", "-c", 'exec "$HERDR_PLUGIN_ROOT/open-url.sh"']

[[link_handlers]]
id = "http"
title = "Open in Terminal Browser"
pattern = "^https?://"
action = "open-url"
